name: Compilar CUZODINCA Windows

on:
  workflow_dispatch: # Permite compilar únicamente de forma manual desde la web

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --collect-all customtkinter --name "CUZODINCA" main.py

      - name: Empaquetar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CUZODINCA-Windows
          path: dist/CUZODINCA/
